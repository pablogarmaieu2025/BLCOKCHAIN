name: Prototype checks
on:
  push:
    branches: [veil-talks-v2]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: talks-campus-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run compile
      - run: python -m pytest -q tests veil-python/tests
      - run: python demo.py
      - run: python scripts/deploy.py --local --smoke
      - run: python scripts/calibration.py
      - run: python -m compileall -q app.py scripts
